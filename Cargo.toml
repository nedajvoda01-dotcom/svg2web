[workspace]
members = [
	"crates/svg2web-core",
	"crates/svg2web-cache",
	"crates/svg2web-generator",
	"crates/svg2web-cli",
	"crates/svg2web-wasm",
	"xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/org/svg2web"

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3"
clap = { version = "=4.5.28", features = ["derive"] }
console_error_panic_hook = "0.1"
criterion = "0.5"
env_logger = "0.11"
js-sys = "0.3"
lru = "0.11"
resvg = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sled = "0.34"
tera = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
usvg = "0.35"
wasm-bindgen = "0.2"
web-sys = "0.3"
webp = "0.3"
zip = "0.6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
