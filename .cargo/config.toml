# [Config] | Cargo конфигурация проекта. [build]: target-dir="target" (единая директория для workspace), incremental=true (ускорение пересборки). [target.x86_64-unknown-linux-gnu]: linker="clang", rustflags=["-C", "link-arg=-fuse-ld=lld"] (ускорение линковки). [target.wasm32-unknown-unknown]: runner="wasm-bindgen-test-runner" (для тестов WASM). [env]: CARGO_NET_RETRY="10", RUST_BACKTRACE="1". [registries.crates-io]: protocol="sparse" (ускорение загрузки зависимостей). Применяется ко всем командам cargo в проекте
