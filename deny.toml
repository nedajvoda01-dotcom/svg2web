[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
denied = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-3.0",
]
copyleft = "warn"
unlicensed = "deny"
exceptions = []

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

